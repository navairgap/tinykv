name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: build & test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Build with strict warnings
        run: make all CC=${{ matrix.compiler }}
      - name: Run all tests
        run: make test CC=${{ matrix.compiler }}
      - name: Run deterministic fuzz harness
        run: make fuzz CC=${{ matrix.compiler }}
      - name: CLI smoke test
        run: make smoke CC=${{ matrix.compiler }}

  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build with sanitizers
        run: make all CC=gcc SAN=1
      - name: Run tests under sanitizers
        run: make test CC=gcc SAN=1
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1
      - name: Run fuzz harness under sanitizers
        run: make fuzz CC=gcc SAN=1

  valgrind:
    name: valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build
        run: make all CC=gcc
      - name: Run tests under valgrind
        run: >
          valgrind --leak-check=full --show-leak-kinds=definite
          --errors-for-leak-kinds=definite --error-exitcode=99
          build/test_record_codec
          build/test_index
          build/test_io
          build/test_log
          build/test_db
          build/test_golden

  threads:
    name: threads + tsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build with ThreadSanitizer
        run: make all CC=gcc TSAN=1
      - name: Run tests under ThreadSanitizer
        run: make test CC=gcc TSAN=1
      - name: Also build and test without threads
        run: |
          make clean
          make all CC=gcc NO_THREADS=1
          make test CC=gcc NO_THREADS=1

  libfuzzer:
    name: libfuzzer smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile fuzz target with libFuzzer
        run: >
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic
          -D_POSIX_C_SOURCE=200809L -fsanitize=fuzzer,address
          -DTINYKV_HAVE_LIBFUZZER -Iinclude -Isrc
          src/record_codec.c src/tkv_log.c src/tkv_io.c
          fuzz/record_codec_fuzz.c
          -o /tmp/record-fuzz
      - name: Fuzz the codec for 60 seconds
        run: /tmp/record-fuzz -max_total_time=60 -rss_limit_mb=2048

  tool-smoke:
    name: cli smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: make all CC=gcc
      - name: Exercise the tinykv tool
        run: make smoke CC=gcc
